[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "residential-energy-management"
version = "0.1.0"
description = "Residential energy management system with load estimation and dynamic battery control."
requires-python = ">=3.12"
dependencies = [
    "requests",
    "python-dotenv",
    "PyYAML",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]