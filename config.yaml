name: Residential Energy Manager
version: "0.3.0"
breaking_versions:
  - "0.2.0"
slug: residential_energy_manager
description: Local MARSTEK energy management and advisory PV forecasts
arch:
  - aarch64
  - amd64
stage: experimental
startup: application
boot: manual
init: true
timeout: 60
homeassistant_api: true
map:
  - type: app_config
    read_only: false
options:
  run_manager: false
  import_state: false
  export_logs: false
  debug_logging: false
  forecast_data_logging: true
  forecast_log_max_mib: 200
  debug_log_max_mib: 10
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  marstek_device_type: ""
  marstek_device_mac: ""
  brightsky_timezone: Europe/Berlin
  brightsky_max_distance_m: 50000
schema:
  run_manager: bool
  import_state: bool
  export_logs: bool
  debug_logging: bool
  forecast_data_logging: bool
  forecast_log_max_mib: "int(1,10240)"
  debug_log_max_mib: "int(1,10240)"
  mqtt_host: str
  mqtt_port: port
  mqtt_username: str
  mqtt_password: password
  marstek_device_type: str
  marstek_device_mac: str
  brightsky_latitude: "float(-90,90)?"
  brightsky_longitude: "float(-180,180)?"
  brightsky_timezone: str
  brightsky_max_distance_m: "int(0,)"
