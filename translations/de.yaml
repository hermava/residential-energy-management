configuration:
  export_logs:
    name: CSV-Messdaten exportieren
    description: "Beim nächsten Start die vorhandenen Messdaten nach log-export im App-Konfigurationsordner kopieren und beenden. Über Samba zugänglich. Energie-Manager und Zustandsimport müssen ausgeschaltet sein. Danach Export wieder ausschalten."
  debug_logging:
    name: Ausführliche Diagnoseaufzeichnung
    description: "Für gezielte Fehlersuche: MARSTEK-Rohdaten, Forecast-Diagnosen und Konsolenwerte jedes Zyklus aufzeichnen. Standardmäßig aus."
  forecast_data_logging:
    name: Daten für Forecast-Entwicklung sammeln
    description: "Kompakte PV-Eingangsleistung und archivierte Wettervorhersagen sammeln. Unabhängig von der Diagnoseaufzeichnung."
  forecast_log_max_mib:
    name: Forecast-Speicherbudget (MiB)
    description: "Gemeinsames Budget für PV- und Wetter-CSV. Älteste abgeschlossene Tagesdateien werden entfernt. Heutige Dateien bleiben erhalten; bei vollem Budget pausiert die Aufzeichnung."
  debug_log_max_mib:
    name: Diagnose-Speicherbudget je Ordner (MiB)
    description: "Gilt getrennt für die Ordner marstek und forecast. Bei aktiver Diagnoseaufzeichnung werden die ältesten abgeschlossenen Diagnose-CSV entfernt."
  import_state:
    name: Bestehende Zustände importieren
    description: "Einmalige Übernahme der JSON-Dateien aus state-import. Nur bei ausgeschaltetem Manager möglich; vorhandene abweichende Zustände werden nicht überschrieben. Danach wieder ausschalten."
  run_manager:
    name: Energie-Manager starten
    description: "Aus: lokale Konfiguration prüfen und beenden. Ein: Manager mit Batterieregelung starten. Vorher den bisherigen Dienst stoppen."
  mqtt_host:
    name: MQTT-Broker
    description: Hostname oder IP des bisherigen MARSTEK-Brokers.
  mqtt_port:
    name: MQTT-Port
  mqtt_username:
    name: MQTT-Benutzername
  mqtt_password:
    name: MQTT-Passwort
  marstek_device_type:
    name: MARSTEK-Gerätetyp
    description: Den Wert aus der bisherigen lokalen Konfiguration übernehmen.
  marstek_device_mac:
    name: MARSTEK-Gerätekennung
    description: Die bisher verwendete Gerätekennung unverändert übernehmen.
  brightsky_latitude:
    name: Breitengrad
    description: Optional. Beide Koordinaten angeben, um die Wetterprognose zu aktivieren.
  brightsky_longitude:
    name: Längengrad
    description: Optional. Beide Koordinaten angeben, um die Wetterprognose zu aktivieren.
  brightsky_timezone:
    name: Zeitzone
    description: Beispielsweise Europe/Berlin.
  brightsky_max_distance_m:
    name: Maximaler Wetterstationsabstand
    description: Suchradius in Metern.
