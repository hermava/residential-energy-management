power_sensors:
  washing_machine:
    entity_id: sensor.washing_machine_power
    channel_type: consumer
    min_power_w: 0
    max_power_w: 2500
    max_age_seconds: 30

estimated_consumers:
  tv:
    entity_id: switch.tv
    estimated_power_w: 85
    max_age_seconds: 60

constant_consumers:
  fridge:
    estimated_power_w: 50

outputs:
  forecast_status_today:
    entity_id: sensor.residential_energy_forecast_today

  forecast_status_tomorrow:
    entity_id: sensor.residential_energy_forecast_tomorrow

  forecast_status_day_after_tomorrow:
    entity_id: sensor.residential_energy_forecast_day_after_tomorrow

  battery_input_forecast_tomorrow_kwh:
    entity_id: sensor.residential_energy_forecast_tomorrow_kwh

  battery_input_forecast_day_after_tomorrow_kwh:
    entity_id: sensor.residential_energy_forecast_day_after_tomorrow_kwh

  battery_input_forecast_tomorrow_error_kwh:
    entity_id: sensor.residential_energy_forecast_tomorrow_error_kwh

  battery_input_forecast_now_w:
    entity_id: sensor.residential_power_forecast_now

  battery_input_energy_today:
    entity_id: sensor.residential_battery_input_energy_today

  battery_output_energy_today:
    entity_id: sensor.residential_battery_output_energy_today

  estimated_total_load:
    entity_id: sensor.residential_estimated_total_load

  battery_soc:
    entity_id: sensor.residential_battery_soc

  battery_input_power:
    entity_id: sensor.residential_battery_input_power

  battery_output_power:
    entity_id: sensor.residential_battery_output_power

  battery_output_target:
    entity_id: sensor.residential_battery_output_target

battery:
  capacity_wh: 2500
  min_soc_percent: 20
  max_output_power_w: 800
  max_age_seconds: 120
  control_inhibit_soc_percent: 95

forecast_sources:
  daylight:
    provider: home_assistant
    sunset:
      entity_id: sensor.sun_next_setting

  solar:
    provider: forecast_solar
    power_now:
      entity_id: sensor.power_production_now
      unit: W
    next_hour:
      entity_id: sensor.energy_next_hour
      unit: kWh
    today_remaining:
      entity_id: sensor.energy_production_today_remaining
      unit: kWh
    tomorrow:
      entity_id: sensor.energy_production_tomorrow
      unit: kWh

  weather:
    provider: openweathermap
    condition:
      entity_id: sensor.openweathermap_condition
    cloud_coverage:
      entity_id: sensor.openweathermap_cloud_coverage
      unit: "%"
    temperature:
      entity_id: sensor.openweathermap_temperature
      unit: "°C"

# Azimuth convention: 0 degrees north, increasing clockwise; tilt: 0 horizontal, 90 vertical.
solar_array:
  azimuth_deg: 143
  tilt_deg: 60

# Heuristic correction for today's remaining energy; limits need calibration.
forecast_correction:
  method: ratio_of_means_v1
  min_forecast_power_w: 50
  min_factor: 0.25
  max_factor: 4
  max_age_seconds: 1800

# Aggregate daily balance uses measured Marstek input energy directly.
energy_forecast:
  consumption_w: 130
  surplus_min_soc_percent: 30
  surplus_target_soc_percent: 95
  reserve_soc_percent: 30
  input_history_max_age_seconds: 120
